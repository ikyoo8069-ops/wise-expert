<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>슬기로운 전문가 — N2B 사업기획</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
    .gradient-bg { background: linear-gradient(135deg, #14213d 0%, #1d3557 50%, #0d1b2a 100%); }
    .card-hover:hover { transform: translateY(-3px); box-shadow: 0 15px 40px rgba(99,102,241,0.25); }
    .cand { transition: all 0.3s; }
    .util-bar { transition: width 0.6s ease; }
</style>
</head>
<body class="gradient-bg min-h-screen">

<header class="text-white py-8">
    <div class="container mx-auto px-4 text-center">
        <h1 class="text-3xl font-bold mb-2">🧭 슬기로운 전문가</h1>
        <p class="text-gray-300">이력에서 대체의 궤적을 읽고, 학회와 함께 할 사업을 기획합니다</p>
        <p class="text-sm text-gray-400 mt-1">N2B — 엣지에 가서 시비를 걸어라 · 나눔으로 대안을 찾아라 · 사례로 증명하라</p>
    </div>
</header>

<main class="container mx-auto px-4 py-6 max-w-2xl">

    <!-- 상태 -->
    <div class="bg-white/10 backdrop-blur rounded-xl p-4 mb-6">
        <div class="flex items-center justify-between flex-wrap gap-2">
            <span class="text-white text-sm" id="usageText">남은 횟수: 확인 중...</span>
            <div class="flex items-center gap-2">
                <span id="tierBadge" class="px-2 py-1 bg-gray-500/30 text-gray-300 rounded-full text-xs">일반</span>
                <span id="backendStatus" class="px-3 py-1 bg-gray-500/30 text-gray-300 rounded-full text-xs">서버 확인 중</span>
                <button onclick="togglePremiumInput()" id="premiumToggleBtn" class="px-3 py-1 bg-indigo-500/80 text-white rounded-full text-xs hover:bg-indigo-500 transition">🔑 프리미엄</button>
            </div>
        </div>
        <div id="premiumInput" class="hidden mt-3 flex gap-2">
            <input type="password" id="premiumKey" placeholder="프리미엄 키 입력" class="flex-1 px-3 py-2 bg-white/20 border border-white/30 rounded-lg text-white text-sm placeholder-gray-400">
            <button onclick="activatePremium()" class="px-4 py-2 bg-indigo-500 text-white rounded-lg text-sm hover:bg-indigo-600 transition">확인</button>
        </div>
    </div>

    <!-- 1단계 입력 -->
    <div id="inputSection" class="bg-white/10 backdrop-blur rounded-xl p-6 mb-6">
        <h2 class="text-xl font-bold text-white mb-2">📋 전문가 이력·포트폴리오</h2>
        <p class="text-gray-400 text-sm mb-4">이력서, 논문 목록, 특허 목록, 수행 과제를 그대로 붙여넣으세요. 아는 만큼만 넣으셔도 됩니다.</p>

        <div class="flex flex-wrap gap-2 mb-4">
            <button onclick="loadSample(1)" class="px-3 py-2 bg-white/10 border border-white/20 rounded-lg text-gray-300 text-xs hover:border-indigo-400">샘플: 기술 분야</button>
            <button onclick="loadSample(2)" class="px-3 py-2 bg-white/10 border border-white/20 rounded-lg text-gray-300 text-xs hover:border-indigo-400">샘플: 회계·세무</button>
            <button onclick="loadSample(3)" class="px-3 py-2 bg-white/10 border border-white/20 rounded-lg text-gray-300 text-xs hover:border-indigo-400">샘플: 법률·부동산</button>
        </div>

        <textarea id="profile" rows="10" class="w-full px-4 py-3 bg-white/20 border border-white/30 rounded-lg text-white text-sm placeholder-gray-400" placeholder="□ 성명&#10;□ 학력&#10;□ 경력&#10;□ 논문·특허·수행과제&#10;□ 상훈"></textarea>

        <div class="grid md:grid-cols-2 gap-3 mt-4">
            <div>
                <label class="block text-sm text-gray-400 mb-1">지금 관심 있는 것 <span class="text-gray-600">(선택)</span></label>
                <textarea id="interest" rows="2" class="w-full px-3 py-2 bg-white/20 border border-white/30 rounded-lg text-white text-sm placeholder-gray-400" placeholder="요즘 하고 싶은 일이 있으면"></textarea>
            </div>
            <div>
                <label class="block text-sm text-gray-400 mb-1">최근 아쉬웠던 것 <span class="text-gray-600">(선택)</span></label>
                <textarea id="regret" rows="2" class="w-full px-3 py-2 bg-white/20 border border-white/30 rounded-lg text-white text-sm placeholder-gray-400" placeholder="막혔거나 놓친 일이 있으면"></textarea>
            </div>
        </div>

        <div class="mt-4">
            <label class="block text-sm text-gray-400 mb-1">함께 할 기관</label>
            <input id="society" value="한국자산관리학회" class="w-full px-3 py-2 bg-white/20 border border-white/30 rounded-lg text-white text-sm">
        </div>

        <button onclick="runTrace()" class="w-full mt-5 py-4 bg-gradient-to-r from-indigo-500 to-purple-600 text-white rounded-xl font-bold text-lg hover:opacity-90 transition">
            🧭 궤적 읽고 사업 후보 찾기
        </button>
        <p class="text-gray-500 text-xs mt-3">입력한 내용은 저장하지 않습니다.</p>
    </div>

    <!-- 로딩 -->
    <div id="loading" class="hidden text-center py-8">
        <div class="inline-block animate-spin rounded-full h-12 w-12 border-4 border-indigo-400 border-t-transparent"></div>
        <p class="mt-4 text-gray-300" id="loadingText">읽는 중...</p>
    </div>

    <!-- 2단계 궤적 -->
    <div id="traceSection" class="hidden mb-6"></div>

    <!-- 3단계 후보 -->
    <div id="candSection" class="hidden mb-6"></div>

    <!-- 4단계 초안 -->
    <div id="draftSection" class="hidden mb-6"></div>

</main>

<footer class="text-center py-6 text-gray-500 text-sm">
    <p>© 2025 N2B Framework | Brian Yoo</p>
</footer>

<script>
const BACKEND_URL = 'https://n2b-backend-1.onrender.com';
let premiumKey = localStorage.getItem('expert_premium_key') || '';
let traceData = null;
let candidates = [];
let chosen = null;
let draftData = null;

const SAMPLES = {
1: `□ 성명 : 홍길동
□ 학력
 ㅇ ○○대학교 토목공학과 졸업 (공학사)
 ㅇ ○○대학교 대학원 토목공학과 졸업 (공학박사)
□ 경력
 ㅇ 국책연구기관 도로교통연구본부 선임연구위원 (1990~2024)
 ㅇ 인프라안전연구본부 연구위원
□ 논문·특허·수행과제
 ㅇ 포장 균열 제어 공법 특허 3건
 ㅇ 도로 포장 잔존수명 평가 기법 연구
 ㅇ 국도 포장 유지관리 체계 개선 연구 (국토교통부)
□ 상훈
 ㅇ 국무총리 표창, 행정안전부장관 표창`,
2: `□ 성명 : 김영수
□ 학력
 ㅇ ○○대학교 회계학 박사
 ㅇ 공인회계사(CPA)
□ 경력
 ㅇ 국세심사위원, 납세자보호위원
 ㅇ 항만위원
 ㅇ ○○대학교 경영학과 교수 (현)
 ㅇ 한국회계학회 상임이사 (현)
□ 논문·수행과제
 ㅇ 공공기관 자산 평가와 세무 처리에 관한 연구
 ㅇ 지방자치단체 공유재산 회계처리 개선 연구
□ 상훈
 ㅇ 국세청장 포상`,
3: `□ 성명 : 박정민
□ 학력
 ㅇ ○○대학교 경영학과 졸업
 ㅇ ○○대학교 법학전문대학원 졸업 (법학석사)
 ㅇ ○○대학교 법학과 박사 졸업 (국제법)
□ 경력
 ㅇ 법무법인 소속 변호사
 ㅇ 지방국세청 국세심사위원 (현)
 ㅇ 법무법인 대표변호사 (현)
 ㅇ 부동산자산관리 담당 전문변호사
□ 수행 분야
 ㅇ 공유재산 처분·활용 관련 법률 자문
 ㅇ 부동산 개발 인허가 분쟁`
};

function esc(s) {
    return String(s == null ? '' : s)
        .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
        .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}
function headers() {
    const h = { 'Content-Type':'application/json' };
    if (premiumKey) h['x-premium-key'] = premiumKey;
    return h;
}
function showLoading(t) {
    document.getElementById('loading').classList.remove('hidden');
    document.getElementById('loadingText').textContent = t || '처리 중...';
}
function hideLoading() {
    document.getElementById('loading').classList.add('hidden');
}
function loadSample(n) {
    document.getElementById('profile').value = SAMPLES[n] || '';
}

// 프리미엄 / 사용량 / 서버
function togglePremiumInput() {
    document.getElementById('premiumInput').classList.toggle('hidden');
}
function activatePremium() {
    const k = document.getElementById('premiumKey').value.trim();
    if (!k) return;
    premiumKey = k;
    localStorage.setItem('expert_premium_key', k);
    document.getElementById('premiumInput').classList.add('hidden');
    fetchUsage();
}
function updateUsage(u) {
    if (!u) return;
    document.getElementById('usageText').textContent = `남은 횟수: ${u.remaining}회 / ${u.limit}회`;
    if (u.tier === 'premium') {
        const b = document.getElementById('tierBadge');
        b.textContent = '프리미엄';
        b.className = 'px-2 py-1 bg-indigo-500/50 text-indigo-200 rounded-full text-xs';
        document.getElementById('premiumToggleBtn').style.display = 'none';
    }
}
async function fetchUsage() {
    try {
        const r = await fetch(`${BACKEND_URL}/api/usage`, { headers: headers() });
        if (r.ok) { const d = await r.json(); updateUsage(d.proposal); }
    } catch (e) {}
}
async function checkBackend() {
    const el = document.getElementById('backendStatus');
    try {
        const r = await fetch(`${BACKEND_URL}/health`, { signal: AbortSignal.timeout(12000) });
        if (!r.ok) throw 0;
        el.textContent = '✅ 서버 연결됨';
        el.className = 'px-3 py-1 bg-green-500/30 text-green-300 rounded-full text-xs';
    } catch (e) {
        el.textContent = '⏳ 서버 준비 중 (약 1분)';
        el.className = 'px-3 py-1 bg-yellow-500/30 text-yellow-300 rounded-full text-xs';
        setTimeout(checkBackend, 15000);
    }
}

// ============================================
// 1단계 — 궤적 읽기
// ============================================
async function runTrace() {
    const profile = document.getElementById('profile').value.trim();
    if (!profile) { alert('이력을 붙여넣어 주세요.'); return; }

    showLoading('이력에서 대체의 궤적을 읽고 있습니다...');
    document.getElementById('traceSection').classList.add('hidden');
    document.getElementById('candSection').classList.add('hidden');
    document.getElementById('draftSection').classList.add('hidden');

    try {
        const r = await fetch(`${BACKEND_URL}/api/expert-trace`, {
            method:'POST', headers: headers(),
            body: JSON.stringify({
                profile: profile,
                interest: document.getElementById('interest').value.trim(),
                regret: document.getElementById('regret').value.trim(),
                society: document.getElementById('society').value.trim() || '한국자산관리학회'
            })
        });

        if (r.status === 429) {
            const e = await r.json().catch(()=>({}));
            alert('⚠️ ' + (e.detail || '일일 사용 한도를 초과했습니다.'));
            return;
        }
        if (!r.ok) {
            const e = await r.json().catch(()=>({}));
            throw new Error(e.detail || `서버 오류 (${r.status})`);
        }

        const d = await r.json();
        if (d.usage) updateUsage(d.usage);

        if (!d.success) {
            alert('응답을 해석하지 못했습니다.\n\n' + (d.raw || '').slice(0, 300));
            return;
        }

        traceData = d.result;
        candidates = traceData.candidates || [];
        renderTrace();
        renderCandidates();

    } catch (err) {
        alert('오류: ' + err.message + '\n\n서버가 슬립 상태일 수 있습니다. 잠시 후 다시 시도해주세요.');
    } finally {
        hideLoading();
    }
}

function renderTrace() {
    const t = traceData;
    const ev = (t.trace_evidence || []).map(e =>
        `<li class="text-gray-700 text-sm flex gap-2"><span class="text-indigo-500 font-bold">—</span><span>${esc(e)}</span></li>`
    ).join('');
    const cf = (t.to_confirm || []).map(c =>
        `<li class="text-gray-700 text-sm flex gap-2"><span class="text-orange-500 font-bold">?</span><span>${esc(c)}</span></li>`
    ).join('');

    document.getElementById('traceSection').innerHTML = `
    <div class="bg-white rounded-xl shadow-2xl p-6">
        <h2 class="text-xl font-bold text-gray-800 mb-4">🧭 대체의 궤적</h2>

        <div class="bg-indigo-50 border-l-4 border-indigo-500 p-4 rounded-r-lg mb-4">
            <p class="text-gray-800">${esc(t.trace || '')}</p>
        </div>

        ${ev ? `<div class="mb-4">
            <h3 class="text-sm font-bold text-slate-500 mb-2">궤적의 근거</h3>
            <ul class="space-y-1">${ev}</ul>
        </div>` : ''}

        ${t.core_strength ? `<div class="bg-slate-50 border border-slate-200 rounded-lg overflow-hidden mb-4">
            <div class="px-4 py-2 bg-slate-800 text-white text-xs font-bold">다른 사람이 갖기 어려운 자리</div>
            <div class="p-4"><p class="text-gray-800 font-medium">${esc(t.core_strength)}</p></div>
        </div>` : ''}

        ${t.overlap ? `<div class="bg-purple-50 border-l-4 border-purple-500 p-4 rounded-r-lg mb-4">
            <h3 class="text-sm font-bold text-purple-700 mb-1">자산관리와 겹치는 자리</h3>
            <p class="text-gray-800">${esc(t.overlap)}</p>
        </div>` : ''}

        ${cf ? `<div class="bg-orange-50 border border-orange-200 rounded-lg p-4">
            <h3 class="text-sm font-bold text-orange-700 mb-2">이력만으로는 알 수 없어 확인이 필요합니다</h3>
            <ul class="space-y-1">${cf}</ul>
        </div>` : ''}
    </div>`;
    document.getElementById('traceSection').classList.remove('hidden');
}

// ============================================
// 2단계 — 사업 후보
// ============================================
function renderCandidates() {
    if (!candidates.length) {
        document.getElementById('candSection').innerHTML = `
        <div class="bg-yellow-50 border border-yellow-200 rounded-xl p-4 text-center">
            <p class="text-yellow-700">학회와 함께 할 사업 후보를 찾지 못했습니다.</p>
            <p class="text-yellow-600 text-sm mt-2">이력을 더 넣거나 관심 분야를 적어주세요.</p>
        </div>`;
        document.getElementById('candSection').classList.remove('hidden');
        return;
    }

    const cards = candidates.map((c, i) => {
        const util = Math.max(0, Math.min(100, c.utility || 0));
        const resolved = (c.resolved || []).map(r =>
            `<li class="text-gray-700 text-sm flex gap-2"><span class="text-amber-600 font-bold">—</span><span>${esc(r)}</span></li>`
        ).join('');
        const need = (c.need_expertise || []).map(n =>
            `<span class="px-2 py-1 bg-purple-100 text-purple-700 rounded text-xs">${esc(n)}</span>`
        ).join(' ');

        return `
        <div class="cand bg-white rounded-xl shadow-xl p-5 mb-4 card-hover transition">
            <div class="flex items-start justify-between gap-3 mb-3">
                <h3 class="text-lg font-bold text-gray-800">${esc(c.title || '이름 없음')}</h3>
                <span class="shrink-0 px-2 py-1 bg-amber-100 text-amber-700 rounded text-xs font-bold">실용성 ${util}</span>
            </div>

            <div class="bg-slate-50 border border-slate-200 rounded-lg overflow-hidden mb-3">
                <div class="px-3 py-1.5 bg-slate-800 text-white text-xs font-bold">엣지 — 지금 이 자리를 장악하고 있는 것</div>
                <div class="p-3 space-y-2">
                    <p class="text-gray-800 text-sm font-medium">${esc(c.edge || '')}</p>
                    ${c.lumped ? `<div><p class="text-xs font-bold text-slate-500">한 덩어리로 묶여 있는 것</p><p class="text-gray-700 text-sm">${esc(c.lumped)}</p></div>` : ''}
                    ${c.divide_axis ? `<div class="flex items-center gap-2"><span class="text-xs font-bold text-slate-500">나눈 축</span><span class="px-2 py-0.5 bg-slate-800 text-white rounded text-xs">${esc(c.divide_axis)}</span></div>` : ''}
                </div>
            </div>

            ${c.alternative ? `<div class="bg-blue-50 border-l-4 border-blue-500 p-3 rounded-r-lg mb-3">
                <p class="text-xs font-bold text-blue-700">나눈 자리에 들어서는 것</p>
                <p class="text-gray-700 text-sm mt-1">${esc(c.alternative)}</p>
            </div>` : ''}

            ${resolved ? `<div class="mb-3">
                <p class="text-xs font-bold text-amber-700 mb-1">함께 풀리는 것</p>
                <ul class="space-y-0.5">${resolved}</ul>
                <div class="h-1.5 bg-gray-200 rounded-full overflow-hidden mt-2">
                    <div class="util-bar h-full bg-amber-500" style="width:${util}%"></div>
                </div>
            </div>` : ''}

            ${c.why_together ? `<div class="bg-green-50 border-l-4 border-green-500 p-3 rounded-r-lg mb-3">
                <p class="text-xs font-bold text-green-700">학회가 함께하면 무엇이 더 되는가</p>
                <p class="text-gray-700 text-sm mt-1">${esc(c.why_together)}</p>
            </div>` : ''}

            ${need ? `<div class="mb-4"><p class="text-xs font-bold text-slate-500 mb-1">필요한 다른 전문분야</p><div class="flex flex-wrap gap-1">${need}</div></div>` : ''}

            <button onclick="pickCandidate(${i})" class="w-full py-3 bg-gradient-to-r from-indigo-500 to-purple-600 text-white rounded-lg font-bold text-sm hover:opacity-90 transition">
                📄 이 사업으로 기획서 초안 만들기
            </button>
        </div>`;
    }).join('');

    document.getElementById('candSection').innerHTML = `
    <h2 class="text-xl font-bold text-white mb-1">🎯 학회와 함께 할 사업 후보</h2>
    <p class="text-gray-400 text-sm mb-4">학회가 함께함으로써 풀리는 양이 늘어나는 것만 골랐습니다. 실용성은 이 대체로 함께 풀리는 양입니다.</p>
    ${cards}`;
    document.getElementById('candSection').classList.remove('hidden');
    document.getElementById('candSection').scrollIntoView({ behavior:'smooth' });
}

// ============================================
// 3단계 — 기획서 초안
// ============================================
async function pickCandidate(i) {
    chosen = candidates[i];
    if (!chosen) return;

    showLoading('기획서 초안을 쓰고 있습니다...');
    document.getElementById('draftSection').classList.add('hidden');

    try {
        const r = await fetch(`${BACKEND_URL}/api/expert-draft`, {
            method:'POST', headers: headers(),
            body: JSON.stringify({
                profile: document.getElementById('profile').value.trim(),
                trace: (traceData && traceData.trace) || '',
                topic: chosen.title || '',
                edge: chosen.edge || '',
                lumped: chosen.lumped || '',
                divide_axis: chosen.divide_axis || '',
                alternative: chosen.alternative || '',
                why_together: chosen.why_together || '',
                need_expertise: chosen.need_expertise || [],
                society: document.getElementById('society').value.trim() || '한국자산관리학회'
            })
        });

        if (r.status === 429) {
            const e = await r.json().catch(()=>({}));
            alert('⚠️ ' + (e.detail || '일일 사용 한도를 초과했습니다.'));
            return;
        }
        if (!r.ok) {
            const e = await r.json().catch(()=>({}));
            throw new Error(e.detail || `서버 오류 (${r.status})`);
        }

        const d = await r.json();
        if (d.usage) updateUsage(d.usage);
        if (!d.success) {
            alert('응답을 해석하지 못했습니다.\n\n' + (d.raw || '').slice(0, 300));
            return;
        }

        draftData = d.result;
        renderDraft();

    } catch (err) {
        alert('오류: ' + err.message);
    } finally {
        hideLoading();
    }
}

function renderDraft() {
    const D = draftData;
    const li = (arr, color) => (arr || []).map(x =>
        `<li class="text-gray-700 text-sm flex gap-2"><span class="${color} font-bold">—</span><span>${esc(x)}</span></li>`
    ).join('');
    const roles = (D.roles || []).map(r => `
        <div class="flex gap-3 py-2 border-b border-gray-100 last:border-0">
            <span class="shrink-0 w-32 text-sm font-bold text-slate-600">${esc(r.who || '')}</span>
            <span class="text-gray-700 text-sm">${esc(r.what || '')}</span>
        </div>`).join('');
    const confirm = (D.to_confirm || []).map(c =>
        `<li class="text-gray-700 text-sm flex gap-2"><span class="text-orange-500 font-bold">?</span><span>${esc(c)}</span></li>`
    ).join('');

    document.getElementById('draftSection').innerHTML = `
    <div class="bg-white rounded-xl shadow-2xl p-6">
        <div class="flex items-start justify-between gap-3 mb-1">
            <h2 class="text-xl font-bold text-gray-800">📄 사업 기획서 초안</h2>
            <button onclick="copyDraft()" class="shrink-0 px-3 py-1.5 bg-slate-700 text-white rounded-lg text-xs hover:bg-slate-800 transition">📋 복사</button>
        </div>
        <p class="text-gray-500 text-xs mb-5">완성본이 아닙니다. 고칠 데가 보이도록 쓴 초안입니다.</p>

        <h3 class="text-lg font-bold text-indigo-700 mb-1">${esc(D.title || '')}</h3>
        <p class="text-gray-700 mb-5">${esc(D.one_line || '')}</p>

        <div class="space-y-4">
            <div class="bg-slate-50 border-l-4 border-slate-400 p-4 rounded-r-lg">
                <h4 class="text-sm font-bold text-slate-700 mb-1">1. 추진 배경</h4>
                <p class="text-gray-700 text-sm">${esc(D.background || '')}</p>
            </div>
            <div class="bg-red-50 border-l-4 border-red-500 p-4 rounded-r-lg">
                <h4 class="text-sm font-bold text-red-700 mb-1">2. 필요성</h4>
                <p class="text-gray-700 text-sm">${esc(D.necessity || '')}</p>
            </div>
            <div class="bg-blue-50 border-l-4 border-blue-500 p-4 rounded-r-lg">
                <h4 class="text-sm font-bold text-blue-700 mb-1">3. 문제 정의 (N2B)</h4>
                <p class="text-gray-700 text-sm whitespace-pre-line">${esc(D.problem || '')}</p>
            </div>
            <div class="bg-green-50 border-l-4 border-green-500 p-4 rounded-r-lg">
                <h4 class="text-sm font-bold text-green-700 mb-1">4. 사업 목표</h4>
                <p class="text-gray-700 text-sm">${esc(D.objective || '')}</p>
            </div>
        </div>

        ${D.scope && D.scope.length ? `<div class="mt-5">
            <h4 class="text-sm font-bold text-slate-700 mb-2">5. 수행 범위</h4>
            <ul class="space-y-1">${li(D.scope, 'text-indigo-500')}</ul>
        </div>` : ''}

        ${roles ? `<div class="mt-5">
            <h4 class="text-sm font-bold text-slate-700 mb-2">6. 역할 분담</h4>
            <div class="bg-slate-50 rounded-lg px-4 py-2">${roles}</div>
        </div>` : ''}

        ${D.expected && D.expected.length ? `<div class="mt-5">
            <h4 class="text-sm font-bold text-slate-700 mb-2">7. 기대 효과</h4>
            <ul class="space-y-1">${li(D.expected, 'text-amber-600')}</ul>
        </div>` : ''}

        ${D.funding_route && D.funding_route.length ? `<div class="mt-5">
            <h4 class="text-sm font-bold text-slate-700 mb-2">8. 연계 가능 사업·발주처</h4>
            <ul class="space-y-1">${li(D.funding_route, 'text-green-600')}</ul>
        </div>` : ''}

        ${confirm ? `<div class="mt-6 bg-orange-50 border border-orange-300 rounded-lg p-4">
            <h4 class="text-sm font-bold text-orange-700 mb-2">확인이 필요합니다 — 심층 검토 요청</h4>
            <p class="text-orange-600 text-xs mb-2">아래는 이력만으로 알 수 없어 추측한 대목입니다. 본인 확인을 부탁드립니다.</p>
            <ul class="space-y-1">${confirm}</ul>
        </div>` : ''}

        ${D.next_step ? `<div class="mt-5 bg-indigo-50 border border-indigo-200 rounded-lg p-4">
            <h4 class="text-sm font-bold text-indigo-700 mb-1">바로 할 수 있는 다음 행동</h4>
            <p class="text-gray-700 text-sm">${esc(D.next_step)}</p>
        </div>` : ''}
    </div>`;
    document.getElementById('draftSection').classList.remove('hidden');
    document.getElementById('draftSection').scrollIntoView({ behavior:'smooth' });
}

function copyDraft() {
    const D = draftData;
    if (!D) return;
    const lines = [];
    lines.push(`[사업 기획서 초안]`);
    lines.push(``);
    lines.push(`사업명: ${D.title || ''}`);
    lines.push(`요약: ${D.one_line || ''}`);
    lines.push(``);
    lines.push(`1. 추진 배경`);
    lines.push(D.background || '');
    lines.push(``);
    lines.push(`2. 필요성`);
    lines.push(D.necessity || '');
    lines.push(``);
    lines.push(`3. 문제 정의 (N2B)`);
    lines.push(D.problem || '');
    lines.push(``);
    lines.push(`4. 사업 목표`);
    lines.push(D.objective || '');
    if (D.scope && D.scope.length) {
        lines.push(``);
        lines.push(`5. 수행 범위`);
        D.scope.forEach(s => lines.push(` - ${s}`));
    }
    if (D.roles && D.roles.length) {
        lines.push(``);
        lines.push(`6. 역할 분담`);
        D.roles.forEach(r => lines.push(` - ${r.who || ''}: ${r.what || ''}`));
    }
    if (D.expected && D.expected.length) {
        lines.push(``);
        lines.push(`7. 기대 효과`);
        D.expected.forEach(s => lines.push(` - ${s}`));
    }
    if (D.funding_route && D.funding_route.length) {
        lines.push(``);
        lines.push(`8. 연계 가능 사업·발주처`);
        D.funding_route.forEach(s => lines.push(` - ${s}`));
    }
    if (D.to_confirm && D.to_confirm.length) {
        lines.push(``);
        lines.push(`[확인이 필요합니다 — 심층 검토 요청]`);
        lines.push(`아래는 이력만으로 알 수 없어 추측한 대목입니다.`);
        D.to_confirm.forEach(s => lines.push(` ? ${s}`));
    }
    if (D.next_step) {
        lines.push(``);
        lines.push(`[바로 할 수 있는 다음 행동]`);
        lines.push(D.next_step);
    }
    lines.push(``);
    lines.push(`— N2B Framework`);

    navigator.clipboard.writeText(lines.join('\n')).then(
        () => alert('복사했습니다. 메일이나 메신저에 붙여넣으세요.'),
        () => alert('복사에 실패했습니다.')
    );
}

// 시작
checkBackend();
fetchUsage();
</script>
</body>
</html>
